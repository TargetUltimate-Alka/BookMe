version: "3.9"

services:
  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3000"
    env_file: ./services/auth-service/.env.example
    depends_on:
      - auth-db

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"

  vendor-service:
    build: ./services/vendor-service
    ports:
      - "3002:3000"
    env_file: ./services/vendor-service/.env.example
    depends_on:
      - vendor-db

  vendor-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vendor_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"

  event-booking-service:
    build: ./services/event-booking-service
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - DATABASE_URL=postgres://user:password@event-booking-db:5432/event_booking_db
      - INTERNAL_API_KEY=dev-internal-key-123
      - RABBITMQ_URL=amqp://guest:guest@localhost:5672
      - VENDOR_SERVICE_URL=http://vendor-service:3000
      - VENDOR_CLIENT_MODE=mock
      - DEV_AUTH_BYPASS=true
      - NODE_ENV=development
    depends_on:
      - event-booking-db

  event-booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: event_booking_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"

  payment-feedback-service:
    build: ./services/payment-feedback-service
    ports:
      - "3004:3000"
    env_file: ./services/payment-feedback-service/.env.example
    depends_on:
      - payment-feedback-db

  payment-feedback-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_feedback_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"

  admin-service:
    build: ./services/admin-service
    ports:
      - "3005:3000"
    env_file: ./services/admin-service/.env.example
    depends_on:
      - admin-db

  admin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admin_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5437:5432"

