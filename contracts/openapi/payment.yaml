openapi: "3.1.0"
info:
  title: BookMe Payment, Escrow & Damage Claims API
  version: "1.0.0"
  description: Licensed payment gateway orders (Deposit 40% & Balance 60%), signature-verified webhooks, refunds, escrow payouts, and 48-hour damage claims (FR-PAY-01..06, SRS §11.5).
servers:
  - url: https://api.bookme.com/v1
    description: Production API Gateway
paths:
  /payments/quote:
    get:
      operationId: calculatePaymentQuote
      summary: Quote breakdown including deposit (40%), balance (60%), gateway fee, and GST
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - customer
        - vendor
        - superAdmin
        - supportAgent
      x-requirement-ids:
        - FR-PAY-02
        - FR-PAY-05
        - FR-VEN-11
      x-change: "new"
      parameters:
        - name: bookingId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment breakdown quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentQuote"

  /payments/orders/deposit:
    post:
      operationId: createDepositOrder
      summary: Create gateway payment order for 40% deposit (due within 2 hours of acceptance)
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - customer
      x-requirement-ids:
        - FR-PAY-02
        - FR-BKG-04
      x-change: "modified"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bookingId
              properties:
                bookingId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Gateway deposit order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayOrder"

  /payments/orders/balance:
    post:
      operationId: createBalanceOrder
      summary: Create gateway order for remaining 60% balance (due 48 hours before event)
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - customer
      x-requirement-ids:
        - FR-PAY-02
      x-change: "modified"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bookingId
              properties:
                bookingId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Gateway balance order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayOrder"

  /payments/webhooks/gateway:
    post:
      operationId: handleGatewayWebhook
      summary: Asynchronous payment gateway webhook receiver with HMAC signature verification
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - anonymous
      x-requirement-ids:
        - FR-PAY-01
        - §11.3
        - §11.5
      x-change: "modified"
      parameters:
        - name: X-Gateway-Signature
          in: header
          required: true
          schema:
            type: string
          description: Cryptographic HMAC SHA256 signature generated by payment provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - gatewayPaymentId
                - orderId
              properties:
                event:
                  type: string
                  example: "payment.captured"
                gatewayPaymentId:
                  type: string
                  example: "pay_gw_948291"
                orderId:
                  type: string
                  example: "order_gw_48102"
                amountPaise:
                  $ref: "./common.yaml#/components/schemas/CurrencyPaise"
                status:
                  type: string
                  example: "captured"
      responses:
        "200":
          description: Webhook received, verified, and enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        "401":
          description: Invalid webhook HMAC signature
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ErrorResponse"

  /payments/{id}:
    get:
      operationId: getPaymentById
      summary: Retrieve payment transaction status
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - customer
        - vendor
        - superAdmin
        - financeAdmin
        - supportAgent
      x-requirement-ids:
        - FR-PAY-01
      x-change: "unmodified"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"

  /bookings/{bookingId}/payments:
    get:
      operationId: listPaymentsForBooking
      summary: List all transactions associated with a booking
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - customer
        - vendor
        - superAdmin
        - financeAdmin
      x-requirement-ids:
        - FR-PAY-01
      x-change: "unmodified"
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Array of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentRecord"

  /payments/refunds:
    post:
      operationId: processRefund
      summary: Issue refund to original payment source with audit reason code
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - financeAdmin
        - superAdmin
        - internal
      x-requirement-ids:
        - FR-PAY-04
        - FR-CAN-01
      x-change: "new"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "./common.yaml#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bookingId
                - amountPaise
                - reasonCode
              properties:
                bookingId:
                  type: string
                  format: uuid
                amountPaise:
                  $ref: "./common.yaml#/components/schemas/CurrencyPaise"
                reasonCode:
                  type: string
                  enum:
                    - CUSTOMER_CANCELLATION
                    - VENDOR_CANCELLATION
                    - NO_SHOW_PENALTY
                    - FORCE_MAJEURE_WAIVER
                    - DISPUTE_RESOLUTION
      responses:
        "201":
          description: Refund initiated with payment gateway
          content:
            application/json:
              schema:
                type: object
                properties:
                  refundId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: "PROCESSED"
                  amountPaise:
                    $ref: "./common.yaml#/components/schemas/CurrencyPaise"

  /payouts/{id}/status:
    get:
      operationId: getPayoutStatus
      summary: Check status of escrow settlement payout to vendor
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - vendor
        - superAdmin
        - financeAdmin
      x-requirement-ids:
        - FR-PAY-03
      x-change: "new"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payout status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRecord"

  /vendors/me/payouts:
    get:
      operationId: listVendorPayouts
      summary: List vendor escrow payouts
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - vendor
      x-requirement-ids:
        - FR-PAY-03
      x-change: "modified"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "./common.yaml#/components/parameters/LimitQuery"
        - $ref: "./common.yaml#/components/parameters/CursorQuery"
      responses:
        "200":
          description: Payout history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PayoutRecord"
                  meta:
                    $ref: "./common.yaml#/components/schemas/CursorPaginationMeta"

  /damage-claims:
    post:
      operationId: fileDamageClaim
      summary: Vendor files damage claim with evidence within 48h of booking completion
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - vendor
      x-requirement-ids:
        - FR-PAY-06
      x-change: "new"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bookingId
                - claimedAmountPaise
                - description
                - evidenceUrls
              properties:
                bookingId:
                  type: string
                  format: uuid
                claimedAmountPaise:
                  $ref: "./common.yaml#/components/schemas/CurrencyPaise"
                description:
                  type: string
                  example: "Sound system speaker cone torn and speaker stand broken."
                evidenceUrls:
                  type: array
                  items:
                    type: string
                    format: uri
      responses:
        "201":
          description: Damage claim registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DamageClaim"
        "400":
          description: Claim window expired (>48 hours post completion)
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ErrorResponse"

  /damage-claims/{id}:
    get:
      operationId: getDamageClaim
      summary: View damage claim and evidence
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - customer
        - vendor
        - superAdmin
        - supportAgent
      x-requirement-ids:
        - FR-PAY-06
      x-change: "new"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Damage claim details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DamageClaim"

  /damage-claims/{id}/response:
    post:
      operationId: respondDamageClaim
      summary: Customer submits response and counter-evidence to damage claim
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - customer
      x-requirement-ids:
        - FR-PAY-06
      x-change: "new"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - explanation
              properties:
                explanation:
                  type: string
                counterEvidenceUrls:
                  type: array
                  items:
                    type: string
                    format: uri
                  default: []
      responses:
        "200":
          description: Customer response registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DamageClaim"

  /admin/damage-claims/{id}/decision:
    post:
      operationId: decideDamageClaim
      summary: Support Agent rules on damage claim and applies security deposit
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - supportAgent
        - superAdmin
      x-requirement-ids:
        - FR-PAY-06
        - FR-ADM-01
      x-change: "new"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - approvedAmountPaise
                - rulingRationale
              properties:
                approvedAmountPaise:
                  $ref: "./common.yaml#/components/schemas/CurrencyPaise"
                rulingRationale:
                  type: string
                  example: "Equipment damaged by guests; partial claim upheld."
      responses:
        "200":
          description: Claim resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DamageClaim"

  /bookings/{bookingId}/invoices:
    get:
      operationId: getInvoicesAndReceipts
      summary: Fetch customer receipt and platform GST invoice for lead fees
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - customer
        - vendor
        - superAdmin
        - financeAdmin
      x-requirement-ids:
        - FR-PAY-05
      x-change: "new"
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invoice documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerReceiptPdfUrl:
                    type: string
                    format: uri
                  leadFeeGstInvoicePdfUrl:
                    type: string
                    format: uri
                    nullable: true

  # Deprecated Legacy Sandbox OTP Verification Endpoint
  /payments/{id}/authenticate:
    post:
      deprecated: true
      operationId: authenticatePaymentLegacy
      summary: (Deprecated) Sandbox OTP simulation
      tags:
        - Payment
      x-owner: "B"
      x-roles:
        - customer
      x-requirement-ids:
        - FR-PAY-01
      x-change: "deprecated"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Legacy sandbox success

components:
  schemas:
    PaymentQuote:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid
        totalAgreedPaise:
          $ref: "./common.yaml#/components/schemas/CurrencyPaise"
        depositAmountPaise:
          $ref: "./common.yaml#/components/schemas/CurrencyPaise"
        balanceAmountPaise:
          $ref: "./common.yaml#/components/schemas/CurrencyPaise"
        securityDepositPaise:
          $ref: "./common.yaml#/components/schemas/CurrencyPaise"
        gatewayFeePaise:
          $ref: "./common.yaml#/components/schemas/CurrencyPaise"
        gstAmountPaise:
          $ref: "./common.yaml#/components/schemas/CurrencyPaise"

    GatewayOrder:
      type: object
      properties:
        orderId:
          type: string
        gatewayKeyId:
          type: string
        amountPaise:
          $ref: "./common.yaml#/components/schemas/CurrencyPaise"
        currency:
          type: string
          example: "INR"

    PaymentRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        type:
          $ref: "./common.yaml#/components/schemas/PaymentType"
        amountPaise:
          $ref: "./common.yaml#/components/schemas/CurrencyPaise"
        status:
          $ref: "./common.yaml#/components/schemas/PaymentStatus"
        gatewayPaymentId:
          type: string
        createdAt:
          $ref: "./common.yaml#/components/schemas/DateTimeUtc"

    PayoutRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        amountPaise:
          $ref: "./common.yaml#/components/schemas/CurrencyPaise"
        status:
          type: string
          enum:
            - SCHEDULED
            - ON_HOLD
            - RELEASED
            - FAILED
        scheduledReleaseAt:
          $ref: "./common.yaml#/components/schemas/DateTimeUtc"
        releasedAt:
          $ref: "./common.yaml#/components/schemas/DateTimeUtc"
          nullable: true

    DamageClaim:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        claimedAmountPaise:
          $ref: "./common.yaml#/components/schemas/CurrencyPaise"
        approvedAmountPaise:
          $ref: "./common.yaml#/components/schemas/CurrencyPaise"
          nullable: true
        status:
          type: string
          enum:
            - FILED
            - RESPONDED
            - UPHELD
            - REJECTED
        filedAt:
          $ref: "./common.yaml#/components/schemas/DateTimeUtc"
